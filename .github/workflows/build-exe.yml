# Gera o GameAssets.exe (Windows) a partir do projeto Godot do repositório.
# O .exe fica em Actions > a execução > Artifacts. Em cada push na main ele
# também vai para a página de Releases, com link fixo:
# https://github.com/bportotwich-source/game-assets/releases/download/ultima-versao/GameAssets.exe
name: Build exe

on:
  push:
    branches: [main, kit-galeria]
  pull_request:
    paths: ["editor/**", "menu/**", "visitar/**", "scripts/godot/**", "project.godot", "export_presets.cfg", ".github/workflows/build-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      GODOT: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot e modelos de exportação
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT}-stable
          wget -q $base/Godot_v${GODOT}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT}-stable_linux.x86_64.zip
          mv Godot_v${GODOT}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          unzip -q Godot_v${GODOT}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT}.stable/
          rm -rf templates *.zip *.tpz

      - name: Importar peças
        run: timeout 900 ./godot --headless --editor --quit || true

      - name: Exportar para Windows
        run: |
          mkdir -p build
          ./godot --headless --export-release "Windows Desktop" build/GameAssets.exe
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: GameAssets-windows
          path: build/GameAssets.exe
          retention-days: 30

      - name: Publicar em Releases (última versão)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao build/GameAssets.exe \
            --target "${{ github.sha }}" \
            --title "GameAssets (última versão)" \
            --notes "Gerado automaticamente a partir da main (${{ github.sha }}). Baixe o GameAssets.exe abaixo: menu com o editor de montagem e o passeio pelos prédios."
