<title>Texturas dos Prédios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one working screen. 3D viewport on top, a compact control deck underneath like a materials panel. */
:root{
  --bg:#eceae4; --panel:#f7f6f2; --fg:#23231f; --muted:#67655c; --line:#d3d0c6;
  --accent:#9a5a2c; --accent-fg:#fff8f0; --chip:#e4e1d8;
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif; --body:'IBM Plex Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1b1a; --panel:#232523; --fg:#ecebe5; --muted:#a3a197; --line:#3a3c38; --accent:#d7925a; --accent-fg:#1a1208; --chip:#2e302d; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1b1a; --panel:#232523; --fg:#ecebe5; --muted:#a3a197; --line:#3a3c38; --accent:#d7925a; --accent-fg:#1a1208; --chip:#2e302d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.85rem}
.stage{position:relative;flex:1;min-height:0}
#view{width:100%;height:100%;display:block;touch-action:none}
.tag{position:absolute;top:10px;font:700 .72rem/1 var(--display);text-transform:uppercase;letter-spacing:.08em;background:rgba(20,20,18,.62);color:#f3f1ea;padding:6px 8px;border-radius:4px;pointer-events:none}
#leftLabel{left:max(10px,env(safe-area-inset-left,0px))} #rightLabel{right:max(10px,env(safe-area-inset-right,0px))}
#split{position:absolute;top:0;bottom:0;left:50%;width:0;pointer-events:none}
#split::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#handle{position:absolute;top:50%;left:-20px;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:#fff;color:#222;border:0;pointer-events:auto;cursor:ew-resize;font:700 14px var(--display);box-shadow:0 2px 8px rgba(0,0,0,.3);touch-action:none}
#handle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#status{position:absolute;inset:auto 0 45% 0;text-align:center;color:#1c1c1a;font-weight:500}
.deck{background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 22px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:46vh;overflow-y:auto}
.group{display:flex;flex-direction:column;gap:6px;min-width:0}
.group h2{margin:0;font:700 .7rem/1 var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 .85rem var(--body);background:var(--chip);color:var(--fg);border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.chips button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#styleText{margin:0;font-size:.84rem;color:var(--muted);max-width:62ch;line-height:1.4}
.row{display:flex;align-items:center;gap:10px;font-size:.85rem}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
</style>
<header><h1>Texturas dos prédios</h1><p>Arraste a barra branca para comparar o antes (esquerda) com o estilo novo (direita).</p></header>
<div class="stage">
  <canvas id="view" aria-label="Prédio em 3D"></canvas>
  <span class="tag" id="leftLabel">Atual (liso)</span><span class="tag" id="rightLabel">Detalhado</span>
  <div id="split"><button id="handle" type="button" aria-label="Mover divisão antes/depois">⇔</button></div>
  <div id="status">Carregando…</div>
</div>
<div class="deck">
  <div class="group"><h2>Estilo novo</h2><div class="chips" id="styles"></div><p id="styleText"></p></div>
  <div class="group"><h2>Prédio</h2><div class="chips" id="kits"></div></div>
  <div class="group"><h2>Câmera e luz</h2><div class="chips" id="views"></div>
    <label class="row" for="sun">Sol <input id="sun" type="range" min="0" max="1" step="0.01" value="0.75"></label>
    <label class="row" for="compare"><input id="compare" type="checkbox" checked> Comparar antes e depois</label></div>
</div>
<script>/*BUNDLE*/</script>
